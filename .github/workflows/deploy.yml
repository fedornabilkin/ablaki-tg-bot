name: Telegram bot

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy on the configured VPS
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: telegram-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: project/package-lock.json
      - run: npm ci --prefix project
      - run: npm run build --prefix project
      - run: npm test --prefix project
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ablaki-tg-bot:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ablaki-tg-bot:latest

  deploy:
    name: Deploy on the bot server
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && vars.BOT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy the checked image
        env:
          BOT_HOST: ${{ secrets.BOT_HOST }}
          BOT_PORT: ${{ secrets.BOT_PORT }}
          BOT_USER: ${{ secrets.BOT_USER }}
          BOT_DEPLOY_PATH: ${{ secrets.BOT_DEPLOY_PATH }}
          BOT_SSH_KEY: ${{ secrets.BOT_SSH_KEY }}
          BOT_KNOWN_HOSTS: ${{ secrets.BOT_KNOWN_HOSTS }}
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash docker/deploy.sh
