services:
  telegram-bot:
    image: ghcr.io/fedornabilkin/ablaki-tg-bot:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BOT_DATA_DIR: /data
      BOT_HEALTH_FILE: /tmp/bot-health.json
    volumes:
      - ./data:/data
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=1m,noexec,nosuid,nodev
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const f=require('node:fs');const h=JSON.parse(f.readFileSync(process.env.BOT_HEALTH_FILE,'utf8'));if(Date.now()-h.checkedAt>90000)process.exit(1)
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
